name: Render Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://chepuri-yeswanth.onrender.com/)
          echo "Server responded with HTTP status code: $STATUS"
